name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Resolve the pinned Xcode dependency graph
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Arx.xcodeproj -scheme Arx -onlyUsePackageVersionsFromResolvedFile
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          def pins(path):
              return {p['identity']: p['state'] for p in json.loads(Path(path).read_text())['pins']}
          assert pins('Package.resolved') == pins('Arx.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved')
          PYTHON
      - name: Verify Mac-only target settings
        run: |
          set -euo pipefail
          for CONFIG in Debug Release; do
            for TARGET in Arx ArxTests ArxUITests; do
              xcodebuild -project Arx.xcodeproj -target "$TARGET" -configuration "$CONFIG" -showBuildSettings -json > "settings-$TARGET-$CONFIG.json"
            done
          done
          python3 - <<'PYTHON'
          import json
          import re
          from pathlib import Path
          for config in ('Debug', 'Release'):
              for target in ('Arx', 'ArxTests', 'ArxUITests'):
                  rows = json.loads(Path(f'settings-{target}-{config}.json').read_text())
                  assert isinstance(rows, list) and len(rows) == 1, f'{target}/{config}: missing or extra records'
                  assert rows[0].get('target') == target, f'{target}/{config}: wrong target'
                  settings = rows[0]['buildSettings']
                  assert settings.get('SUPPORTED_PLATFORMS', '').split() == ['macosx'], f'{target}/{config}: not Mac-only'
                  assert not settings.get('TARGETED_DEVICE_FAMILY', '').strip(), f'{target}/{config}: mobile device family remains'
                  sdk = settings.get('SDKROOT', '')
                  assert sdk == 'macosx' or re.fullmatch(r'.*/MacOSX(?:[0-9.]+)?\.sdk', sdk), f'{target}/{config}: not a Mac SDK'
                  assert settings.get('MACOSX_DEPLOYMENT_TARGET') == '27.2', f'{target}/{config}: project minimum changed'
                  print(target, config, 'SUPPORTED_PLATFORMS=' + settings['SUPPORTED_PLATFORMS'], 'SDKROOT=' + settings.get('SDKROOT', ''))
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Check all authored non-Swift files
        run: |
          npm ci --ignore-scripts
          bash scripts/install-linters.sh
          npm run lint
      - name: Lint the Swift sources
        run: swift format lint --strict --recursive BridgeCore BridgeCoreTests BridgeFixtureServer Arx ArxTests ArxUITests Package.swift scripts/fixture-display.swift
      - name: Run bridge package tests
        run: |
          swift test --parallel
          bash scripts/check-listener-exclusivity.sh .build/debug/BridgeFixtureServer
      - name: Verify browser script syntax
        run: |
          node --check BridgeCore/Web/app.js
          node --check scripts/browser-proof.mjs
      - name: Build for macOS
        run: xcodebuild build -project Arx.xcodeproj -scheme Arx -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build
      - name: Verify effective signed entitlements
        run: |
          set -euo pipefail
          APP=.build/Build/Products/Debug/Arx.app
          codesign --force --sign - --options runtime --entitlements Arx/Arx.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > effective-entitlements.plist
          python3 - <<'PYTHON'
          import plistlib
          from pathlib import Path
          expected = plistlib.loads(Path('Arx/Arx.entitlements').read_bytes())
          actual = plistlib.loads(Path('effective-entitlements.plist').read_bytes())
          assert actual == expected, (actual, expected)
          assert actual.get('com.apple.security.app-sandbox') is True
          assert actual.get('com.apple.security.network.server') is True
          assert actual.get('com.apple.security.personal-information.calendars') is True
          PYTHON
      - name: Run the Mac navigation tests
        run: xcodebuild test -project Arx.xcodeproj -scheme Arx -destination 'platform=macOS' -only-testing:ArxTests CODE_SIGNING_ALLOWED=NO MACOSX_DEPLOYMENT_TARGET=27.0 -derivedDataPath .build-unit-tests -resultBundlePath navigation-tests.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arx-mac-only-settings
          path: |
            settings-*.json
            /tmp/arx-restart-stopping.png

  mac-screenshot:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
      - name: Compile and safely probe the fixture display script
        run: |
          set -euo pipefail
          swiftc -typecheck scripts/fixture-display.swift
          status=0
          CI=false swift scripts/fixture-display.swift scripts/capture-mac.sh > "$RUNNER_TEMP/fixture-display-probe.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/fixture-display-probe.log"
          test "$status" -eq 1
          grep -Fq 'Display setup is restricted to CI.' "$RUNNER_TEMP/fixture-display-probe.log"
      - name: Resolve the pinned Xcode dependency graph
        run: xcodebuild -resolvePackageDependencies -project Arx.xcodeproj -scheme Arx -onlyUsePackageVersionsFromResolvedFile
      - name: Build the app
        run: xcodebuild build -project Arx.xcodeproj -scheme Arx -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build
      - name: Launch and capture fixture control panel
        run: bash scripts/capture-mac.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arx-mac
          path: |
            arx-mac-*.png
            navigation-accessibility.txt
            navigation-elements.txt

  browser-proof:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Swift toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/swift.tar.gz" https://download.swift.org/swift-6.4.1-release/ubuntu2204/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu22.04.tar.gz
          echo "e9ec2ff05ac0fc89bf2e7cecdee5da4d398898a768d7ee2b86a59d2a7f01c44b  $RUNNER_TEMP/swift.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/swift-6.4.1-RELEASE-ubuntu22.04/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Build fixture server and run Linux package tests
        run: |
          swift build --product BridgeFixtureServer --jobs 2
          swift test --jobs 2 --parallel
      - name: Locate browser and run HTTPS fixture proof
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export CHROME_PATH
          test -n "$CHROME_PATH"
          bash scripts/check-listener-exclusivity.sh .build/debug/BridgeFixtureServer
          node --test scripts/browser-startup.test.mjs
          node scripts/browser-proof.mjs .build/debug/BridgeFixtureServer browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arx-browser-fixtures
          path: browser-evidence/
